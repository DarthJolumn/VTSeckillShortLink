# ========================================
# LiveMall 本地开发中间件
# 启动: docker compose up -d
# 仅启动核心: docker compose up -d mysql nacos redis-node-{1..6} redis-cluster-init
# Redis Cluster: 3 主 3 从，host 网络模式，端口 6381-6386
# ========================================

services:

  # ==================== MySQL ====================
  mysql:
    image: mysql:latest
    container_name: livemall-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: livemall
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - livemall-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ==================== Redis Cluster ====================
  # 6 个实例，host 网络模式（容器间通过 127.0.0.1:638x 互联）
  # 前 3 为主，后 3 为从（由 --cluster-replicas 1 自动分配）

  redis-node-1:
    image: redis:alpine
    container_name: livemall-redis-1
    restart: unless-stopped
    network_mode: host
    volumes:
      - redis-data-1:/data
    command: >
      redis-server --port 6381
      --cluster-enabled yes
      --cluster-config-file /data/nodes-6381.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --appendfilename appendonly-6381.aof
      --requirepass redis123
      --masterauth redis123
      --cluster-announce-ip 192.168.147.132

  redis-node-2:
    image: redis:alpine
    container_name: livemall-redis-2
    restart: unless-stopped
    network_mode: host
    volumes:
      - redis-data-2:/data
    command: >
      redis-server --port 6382
      --cluster-enabled yes
      --cluster-config-file /data/nodes-6382.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --appendfilename appendonly-6382.aof
      --requirepass redis123
      --masterauth redis123
      --cluster-announce-ip 192.168.147.132

  redis-node-3:
    image: redis:alpine
    container_name: livemall-redis-3
    restart: unless-stopped
    network_mode: host
    volumes:
      - redis-data-3:/data
    command: >
      redis-server --port 6383
      --cluster-enabled yes
      --cluster-config-file /data/nodes-6383.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --appendfilename appendonly-6383.aof
      --requirepass redis123
      --masterauth redis123
      --cluster-announce-ip 192.168.147.132

  redis-node-4:
    image: redis:alpine
    container_name: livemall-redis-4
    restart: unless-stopped
    network_mode: host
    volumes:
      - redis-data-4:/data
    command: >
      redis-server --port 6384
      --cluster-enabled yes
      --cluster-config-file /data/nodes-6384.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --appendfilename appendonly-6384.aof
      --requirepass redis123
      --masterauth redis123
      --cluster-announce-ip 192.168.147.132

  redis-node-5:
    image: redis:alpine
    container_name: livemall-redis-5
    restart: unless-stopped
    network_mode: host
    volumes:
      - redis-data-5:/data
    command: >
      redis-server --port 6385
      --cluster-enabled yes
      --cluster-config-file /data/nodes-6385.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --appendfilename appendonly-6385.aof
      --requirepass redis123
      --masterauth redis123
      --cluster-announce-ip 192.168.147.132

  redis-node-6:
    image: redis:alpine
    container_name: livemall-redis-6
    restart: unless-stopped
    network_mode: host
    volumes:
      - redis-data-6:/data
    command: >
      redis-server --port 6386
      --cluster-enabled yes
      --cluster-config-file /data/nodes-6386.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --appendfilename appendonly-6386.aof
      --requirepass redis123
      --masterauth redis123
      --cluster-announce-ip 192.168.147.132

  # 一键创建集群：前 3 为主，后 3 为从
  redis-cluster-init:
    image: redis:alpine
    container_name: livemall-redis-init
    network_mode: host
    depends_on:
      - redis-node-1
      - redis-node-2
      - redis-node-3
      - redis-node-4
      - redis-node-5
      - redis-node-6
    command: sh -c "echo '等待所有节点就绪...' && for port in 6381 6382 6383 6384 6385 6386; do until redis-cli -a redis123 -p $$port ping 2>/dev/null | grep -q PONG; do sleep 1; done; echo \"节点 $$port 就绪\"; done && echo '创建集群...' && echo yes | redis-cli -a redis123 --cluster create 192.168.147.132:6381 192.168.147.132:6382 192.168.147.132:6383 192.168.147.132:6384 192.168.147.132:6385 192.168.147.132:6386 --cluster-replicas 1 && echo '集群创建完成' && redis-cli -a redis123 -p 6381 cluster info"

  # ==================== Nacos ====================
  nacos:
    image: nacos/nacos-server:v2.1.0-slim
    container_name: livemall-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "false"
    ports:
      - "8848:8848"
      - "9848:9848"
    networks:
      - livemall-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ==================== Kafka 4.2 KRaft ====================
  kafka:
    image: apache/kafka:4.2.1
    container_name: livemall-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CLUSTER_ID: "livemall-kraft-cluster-01"
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://192.168.147.132:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xms512M -Xmx512M"
    ports:
      - "9092:9092"
      - "9093:9093"
    networks:
      - livemall-net
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  mysql-data:
    name: livemall-mysql-data
  redis-data-1:
    name: livemall-redis-data-1
  redis-data-2:
    name: livemall-redis-data-2
  redis-data-3:
    name: livemall-redis-data-3
  redis-data-4:
    name: livemall-redis-data-4
  redis-data-5:
    name: livemall-redis-data-5
  redis-data-6:
    name: livemall-redis-data-6

networks:
  livemall-net:
    name: livemall-net
    driver: bridge
