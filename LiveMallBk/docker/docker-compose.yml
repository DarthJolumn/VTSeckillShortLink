# ========================================
# LiveMall 本地开发中间件
# 启动: docker compose up -d
# 仅启动核心: docker compose up -d mysql redis nacos
# ========================================

services:

  # ==================== MySQL ====================
  mysql:
    image: mysql:latest
    container_name: livemall-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: livemall
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - livemall-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ==================== Redis ====================
  redis:
    image: redis:alpine
    container_name: livemall-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --requirepass redis123 --appendonly yes
    networks:
      - livemall-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ==================== Nacos ====================
  nacos:
    image: nacos/nacos-server:v2.1.0-slim
    container_name: livemall-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "false"
    ports:
      - "8848:8848"
      - "9848:9848"   # gRPC（Dubbo 3.x 需要）
    networks:
      - livemall-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ==================== Kafka 3.6 KRaft ====================
  kafka:
    image: apache/kafka:4.2.1
    container_name: livemall-kafka
    restart: unless-stopped
    environment:
      # KRaft 模式配置
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # 集群 ID (KRaft 必需)
      KAFKA_CLUSTER_ID: "livemall-kraft-cluster-01"

      # 监听器与网络配置
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # 注意：这里的 IP 请确保是你虚拟机的真实 IP
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://192.168.147.132:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # 功能开关
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      # 资源限制
      KAFKA_HEAP_OPTS: "-Xms512M -Xmx512M"

    ports:
      - "9092:9092"
      - "9093:9093"

    networks:
      - livemall-net

    # 健康检查 (修正了 Apache 镜像的脚本路径)
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5


  # ==================== Zipkin（暂时注释，用户服务不需要） ====================
  # zipkin:
  #   image: openzipkin/zipkin:latest
  #   container_name: livemall-zipkin
  #   restart: unless-stopped
  #   ports:
  #     - "9411:9411"
  #   profiles:
  #     - monitor
  #   networks:
  #     - livemall-net

volumes:
  mysql-data:
    name: livemall-mysql-data
  redis-data:
    name: livemall-redis-data

networks:
  livemall-net:
    name: livemall-net
    driver: bridge
